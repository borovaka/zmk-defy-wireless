# SPDX-License-Identifier: MIT
#
# A v* tag builds the images an install needs and attaches them, with
# manifest.json and their SHA-256 sums, to a draft release, which is
# published by hand. It builds from scratch, without the caches CI keeps.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release at a time for each tag; a run in progress is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Release images
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    container:
      # The image scripts/zmk pins.
      image: zmkfirmware/zmk-dev-arm@sha256:77b62cbc6c62ca0026ed9eb511dd7fc2a13692d1b9ddbaf92bca510612390db8
    steps:
      # With the history and tags, so that git describe gives the tag as the
      # module version the images carry.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: scripts/setup --container
      - run: python3 scripts/build --container left-hybrid-radio right-hybrid-radio neuron-hybrid --output build-output
      - name: Check the module version
        run: |
          module="$(python3 -c 'import json, sys; print(json.load(sys.stdin)["module"])' < build-output/manifest.json)"
          if [ "$module" != "$GITHUB_REF_NAME" ]; then
            echo "The images carry module version $module, not the tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
      # The halves carry the radio image they install; the radio's own files
      # and the halves' UF2 copies are not needed to install. The Neuron's UF2
      # file, ZMK alone, is for the UF2 loader's drive. SHA256SUMS covers
      # manifest.json too.
      - name: Collect the images
        run: |
          mkdir release
          cp build-output/left-hybrid-radio.bin build-output/right-hybrid-radio.bin \
             build-output/neuron-hybrid.hex build-output/neuron-hybrid.uf2 \
             build-output/manifest.json release/
          cd release && sha256sum -- * > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error

  publish:
    name: Draft release
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --generate-notes release/*
        env:
          GH_TOKEN: ${{ github.token }}
