# SPDX-License-Identifier: MIT
#
# Keeps the actions the workflows pin by commit current, one pull request a
# week for all of them, and only for releases at least a week old. The ZMK
# container image, pinned by digest in scripts/zmk and the workflows, is
# updated by hand with the ZMK revision.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
