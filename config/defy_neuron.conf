# Settings for the Neuron, which holds the keymap and talks to the computers:
# behaviours, combos, Bluetooth to the computers. ZMK reads this file for the
# Neuron by its board's name; config/defy.conf is for the halves. Board
# defaults live in the zmk-defy-wireless module's boards/dygma/defy_neuron.
# ZMK's configuration options: https://zmk.dev/docs/config
#
# The settings below show the values the firmware uses now. To change one,
# remove its # and edit the value. Mouse keys are the one setting on. The
# lighting, and the timings of hold-taps, combos and tap-dances, are set in
# the keymap.

# The name computers show for the keyboard, over USB and Bluetooth, up to 16
# characters.
# CONFIG_ZMK_KEYBOARD_NAME="Defy"

# Keyboard reports. A change to one of the settings in this part changes what
# the Neuron tells each computer about its reports. A computer on USB reads it
# again when the Neuron restarts. One paired over Bluetooth reads it only after
# you remove the Defy there, clear its profile in the profile chooser and pair
# again.
#
# Every key held at once reaches the computer (NKRO). For six keys at most
# (HKRO), for a computer that does not handle NKRO, set HKRO to y instead.
# CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
# CONFIG_ZMK_HID_REPORT_TYPE_HKRO=n
# With HKRO: how many keys a report holds.
# CONFIG_ZMK_HID_KEYBOARD_REPORT_SIZE=6
#
# With NKRO: F13 to F24 and the international keys. Android then gets no input
# at all from the keyboard.
# CONFIG_ZMK_HID_KEYBOARD_NKRO_EXTENDED_REPORT=n
#
# The full range of media and other consumer keys. Some computers handle only
# the basic range; for those, set BASIC to y instead.
# CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_FULL=y
# CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=n
#
# The USB boot protocol, for a computer's firmware setup and boot menus. It
# turns off the module's USB report recovery, which sends held keys again
# after the computer sleeps.
# CONFIG_ZMK_USB_BOOT=n
#
# Mouse keys: &mkp, &mmv and &msc, which the keymap's Mouse layer uses, with
# #include <dt-bindings/zmk/pointing.h>. To turn them off, set n and take
# them out of the keymap. A computer paired over Bluetooth before they were
# on must pair again to use them.
CONFIG_ZMK_POINTING=y
# With mouse keys: smooth scrolling, on computers that support it.
# CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=n

# Release the modifiers in a report of their own, after the key, for programs
# that see a modifier go up before the key.
# CONFIG_ZMK_HID_SEPARATE_MOD_RELEASE_REPORT=n

# Pairing asks you to type, on the Defy, the passkey the computer shows. Not
# yet tried on a Defy.
# CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

# The Neuron's transmit power, to the computers and to the halves: 0 dBm. For
# more range, set PLUS_8 to y instead; the Neuron then draws more current.
# Other values: PLUS_2 to PLUS_7, MINUS_4, MINUS_8, MINUS_12, MINUS_16,
# MINUS_20 and MINUS_40.
# CONFIG_BT_CTLR_TX_PWR_0=y
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=n

# Combos that can be held down at the same time.
# CONFIG_ZMK_COMBO_MAX_PRESSED_COMBOS=4

# Steps that a macro, or another behaviour that runs several, can queue.
# CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=64

# Macro timing in milliseconds: the wait between steps, and how long a tap
# holds its key. A macro's own wait-ms and tap-ms override them.
# CONFIG_ZMK_MACRO_DEFAULT_WAIT_MS=15
# CONFIG_ZMK_MACRO_DEFAULT_TAP_MS=30

# ZMK Studio is always built in, and the keymap's &studio_unlock, FKeys+O,
# unlocks it for changes. Without the lock, any computer connected to the
# Neuron can change the keymap.
# CONFIG_ZMK_STUDIO_LOCKING=y
# With the lock: seconds without a Studio request before it locks again, and
# whether it locks when Studio disconnects.
# CONFIG_ZMK_STUDIO_LOCK_IDLE_TIMEOUT_SEC=600
# CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=y

# The Neuron's own LED, green while USB is connected and blinking amber while
# the installer holds the halves: its brightness in percent, 1 to 100.
# CONFIG_DEFY_NEURON_STATUS_LED_BRIGHTNESS=3
