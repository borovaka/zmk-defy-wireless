# Settings for the halves, which scan the keys and drive their lights. ZMK
# reads this file for the halves by their board directory's name;
# config/defy_neuron.conf is for the Neuron, which holds the keymap. Board
# defaults live in the zmk-defy-wireless module's boards/dygma/defy.
# ZMK's configuration options: https://zmk.dev/docs/config
#
# The settings below are commented out and show the values the firmware uses
# now. To change one, remove its # and edit the value. Both halves read this
# file. Keymap, Bluetooth and Studio settings belong in defy_neuron.conf, as
# the halves only report keys to the Neuron. A change here reaches the halves
# when defy-installer update writes them; a copy to the DEFY drive writes only
# the Neuron.

# Dormant sleep. A half sleeps after this many milliseconds without a key
# change, unless its cable to the Neuron is connected, it is on charge or the
# battery display is showing. A key press wakes it by restarting it, and it
# reconnects; a short first tap can be lost. From 1000 ms to 86400000 ms, a
# day, which keeps a half awake in practice; the default is five minutes.
# CONFIG_DEFY_HALF_SLEEP_TIMEOUT_MS=300000

# Connected idle. After this many milliseconds without a key change, with no
# key held, a half polls its cable and its link status less often. A key
# change brings it back at once. From 100 ms to 3600000 ms, an hour.
# CONFIG_DEFY_HYBRID_IDLE_TIMEOUT_MS=30000

# Debounce: how long, in milliseconds, a key must read pressed, or released,
# before the half reports the change. -1 keeps the key scanner's 5 ms; 0 for a
# press reports it at the first reading.
# CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=-1
# CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=-1
