CONFIG_ZMK_KEYBOARD_NAME="Defy"
CONFIG_ZMK_STUDIO=y

# Studio's RPC on the second simulated UART, a pseudo-terminal. The first one
# carries the console.
CONFIG_UART_NATIVE_POSIX_PORT_1_ENABLE=y

# Saved keymap changes go to the simulated flash.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_DEFY_STUDIO_USB_PRIORITY=y
