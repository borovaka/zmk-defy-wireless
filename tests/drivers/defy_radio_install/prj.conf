CONFIG_ZTEST=y
CONFIG_BT=y
CONFIG_GPIO=y
CONFIG_LOG=y
CONFIG_ASSERT=y
CONFIG_DEFY_RADIO_INSTALL=y
# The fake radio's rf_bootloader checks seals with crc32_ieee().
CONFIG_CRC=y
# As the RP2040 builds. The driver's retry waits are a tick.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000
