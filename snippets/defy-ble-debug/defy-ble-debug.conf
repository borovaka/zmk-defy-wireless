# The Neuron with a Bluetooth and USB debug log in place of Studio, battery
# telemetry off. scripts/build adds it after zmk-usb-logging for
# neuron-hybrid-log, and turns Studio off; docs/split-diagnostics.md lists the
# logging builds.

CONFIG_DEFY_BATTERY=n

# Studio's Bluetooth transport sets these in neuron-hybrid. They stay, so that
# the links behave as in the build this one debugs.
CONFIG_BT_CONN_TX_MAX=64
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_AUTO_DATA_LEN_UPDATE=n

CONFIG_ZMK_LOG_LEVEL_DBG=y
CONFIG_LOG_DEFAULT_LEVEL=1
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_MODE_OVERFLOW=n
CONFIG_LOG_BUFFER_SIZE=8192
# Time to open the serial port after a replug. The buffer keeps the messages
# from the start until then.
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=10000
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_BT_ASSERT_VERBOSE=y
CONFIG_BT_LOG_LEVEL_WRN=y
CONFIG_BT_HCI_CORE_LOG_LEVEL_INF=y
CONFIG_BT_CONN_LOG_LEVEL_INF=y
CONFIG_BT_SMP_LOG_LEVEL_INF=y
CONFIG_DEFY_USB_REPORT_TRACE=y
CONFIG_DEFY_USB_POSITION_TRACE=y
