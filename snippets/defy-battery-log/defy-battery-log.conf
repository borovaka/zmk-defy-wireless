# The Neuron with a USB serial log in place of Studio, for following the
# halves' battery reports: warnings from everything, and the battery module's
# own messages. scripts/build adds it after zmk-usb-logging for
# neuron-hybrid-battery-log; docs/split-diagnostics.md lists the logging
# builds.

# Without ZMK_LOGGING_MINIMAL, ZMK logs at debug level whatever level is set.
CONFIG_ZMK_LOGGING_MINIMAL=y
CONFIG_ZMK_LOG_LEVEL_WRN=y
CONFIG_LOG_DEFAULT_LEVEL=0
CONFIG_DEFY_BATTERY_LOG_LEVEL_INF=y
CONFIG_LOG_MODE_OVERFLOW=n
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_LOG_BACKEND_FORMAT_TIMESTAMP=n
CONFIG_BT_ASSERT_VERBOSE=y
CONFIG_CBPRINTF_NANO=y
CONFIG_BT_LOG_LEVEL_WRN=y
