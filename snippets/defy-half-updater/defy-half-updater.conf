# The updater's USB serial port, set up as ZMK's studio-rpc-usb-uart snippet
# sets up Studio's, so that this snippet works on its own.
CONFIG_ZMK_USB=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y

# Each I2C transfer to a half's bootloader may take up to 600 ms, the most
# updater/defy_half_bootloader.c allows.
CONFIG_I2C_NRFX_TRANSFER_TIMEOUT=600
