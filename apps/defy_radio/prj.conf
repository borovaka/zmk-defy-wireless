# Bluetooth controller for the RP2040, over SPI.
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_SPI_ASYNC=y
CONFIG_SPI_SLAVE=y
CONFIG_MAIN_STACK_SIZE=512

CONFIG_BT=y
CONFIG_BT_HCI_RAW=y

# A half is a peripheral of the Neuron, with one connection, as the RP2040's
# host is configured. That keeps the image inside the stock application slot,
# 0x1C000 to 0x39000.
CONFIG_BT_MAX_CONN=1
CONFIG_BT_CENTRAL=n
CONFIG_BT_OBSERVER=n
CONFIG_BT_CTLR_PHY_CODED=n
CONFIG_BT_CTLR_PRIVACY=n

# Nothing reads logs without SWD.
CONFIG_LOG=n

# The vendor reboot and power-off commands.
CONFIG_REBOOT=y
CONFIG_POWEROFF=y

# Battery gauge, charger and comparator. A stuck I2C transfer gives up after
# 20 ms rather than the driver's default 500 ms: power-off waits for a sample
# in progress.
CONFIG_I2C=y
CONFIG_I2C_NRFX_TRANSFER_TIMEOUT=20
