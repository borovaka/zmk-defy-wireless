# The drive: Zephyr's USB device stack with its mass storage and CDC ACM
# classes, one instance each. The serial number comes from hwinfo, as ZMK's
# does; Kconfig in this directory holds the IDs and strings.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_MSC_CLASS=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_HWINFO=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y

# ZMK's code_partition and Dygma's boot request page.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_CRC=y

CONFIG_REBOOT=y
CONFIG_POWEROFF=y

# Nothing reads a log or a console without SWD.
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_CONSOLE=n
CONFIG_BOOT_BANNER=n

# The loader drives no pins but the status LED's, through nrfx's PWM
# registers (src/led.c).
CONFIG_GPIO=n

# Size: the loader has 48 KiB.
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
CONFIG_COMMON_LIBC_MALLOC=n
CONFIG_TIMESLICING=n
CONFIG_ERRNO=n
CONFIG_FAULT_DUMP=0
